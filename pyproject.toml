[project]
name = "lclab"
version = "0.1.0"
description = "IBM's 'Build Smarter AI Apps: Empower LLMs with LangChain' lab, rebuilt to run locally with Ollama and IBM Granite."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "certifi>=2024.2.2", # up-to-date HTTPS certificates for downloads
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.0",
    "langchain-ollama>=1.0",
    "langchain-text-splitters>=1.1.3",
    "pydantic>=2.0",
    "pypdf>=6.21.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lclab"]

[dependency-groups]
dev = [
    "pytest>=8",
    "numpy>=2.0",  # needed by LangChain's fake embeddings in tests
]

[tool.pytest.ini_options]
testpaths = ["tests"]
